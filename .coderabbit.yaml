# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: "en-US"
tone_instructions: "Be direct and concise. Focus on correctness, security, architecture, idioms, and consistency."
early_access: false

reviews:
  profile: "chill"
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  high_level_summary_instructions: >-
    Create concise release notes as a bullet-point list, but only if the
    original PR body is insufficient or inaccurate. Extend or clarify the
    PR body content; don't duplicate it.
  collapse_walkthrough: true
  changed_files_summary: false
  sequence_diagrams: false
  request_changes_workflow: false
  commit_status: true
  review_status: false
  poem: false
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: false
  suggested_reviewers: false

  path_instructions:
    - path: "**/*.qml"
      instructions: |
        QML for a Dux (DankMaterialShell, still installed as `dms`) bar plugin
        that lists Todoist tasks in a popout. Dux loads these files at runtime;
        there is no build step and no test suite, so a mistake here surfaces
        only as a silently broken widget. Review for:
        - Imports of `qs.Common`, `qs.Services`, `qs.DCommon.Widgets`,
          `qs.Modules.Plugins` resolve ONLY inside the Dux runtime. Never suggest
          local stubs, module paths, or vendoring them.
        - The API token lives only in the Secret Service via `secret-tool`. Flag
          any path that writes it to plugin settings, logs it, or falls back to
          plaintext when no keyring is reachable.
        - Run `secret-tool` through `components/SecretTool.qml`. A missing binary
          emits neither `started` nor `exited`, so a bare `Process` hangs.
        - `secret-tool store` reads stdin to EOF. The token is written without a
          trailing newline and stdin is closed right after.
        - The days-ahead window is the filter query `due before: +N days`, not
          date math in QML.
        - Detect and launch Todoist through `DesktopEntries.heuristicLookup`,
          never a `todoist` binary; the Flatpak puts none on `PATH`.
        - Only `components/TodoistClient.qml` knows Todoist's response shapes. It
          maps them to plain task objects; the popout must not read API fields.
        - Colors, spacing, and radii come from `Theme.*` tokens, never literals.
          Bar content is sized with `Theme.barIconSize(...)`, never
          `Theme.iconSize`.
        - The bar mark is Todoist's own logo in `components/TodoistMark.qml`,
          recolored through `markColor`. Reject swapping it for a Material icon.
        - Prefer Dux-provided widgets (`StyledText`, `PopoutComponent`,
          `PluginComponent`) over hand-rolled equivalents.
        - A settings pane must declare `pluginId` itself and it must match
          `plugin.json`'s `id`. A wrong literal silently resolves against another
          plugin with no error anywhere.
        - Flag property bindings with side effects, and `Repeater` delegates
          missing `required property` declarations.
    - path: "plugin.json"
      instructions: |
        Dux plugin manifest. Review for:
        - `id` must stay `todoist` and match the directory Dux installs into;
          changing it is a breaking rename for existing users.
        - `capabilities` is `dankbar-widget` only; there is no desktop surface.
        - Every path in `component` and `settings` must point at a file that
          exists. A stale path leaves the plugin unloadable with no clear error.
        - `permissions` should be the minimum the widget actually uses.
        - `requires` lists the executables the widget shells out to; it must
          agree with what the QML actually invokes.
        - `version` follows semver and is the source of truth for release tags.
        - `requires_dms` must be bumped when the code starts depending on a newer
          Dux API.
    - path: "justfile"
      instructions: |
        Task runner for the dev loop. Review for:
        - Shell recipes use `set -euo pipefail`.
        - Recipes must never delete an installed plugin copy; move it aside so
          local changes are recoverable, and stash it outside the config tree,
          which may be a symlink into a dotfiles repo.
        - No hardcoded home paths; honor `XDG_CONFIG_HOME` with a `$HOME`
          fallback.
    - path: "README.md"
      instructions: |
        User-facing documentation. Review for accuracy against `plugin.json`,
        especially the plugin id in install instructions, the `requires_dms`
        floor, and required executables. Any documented setting must actually
        exist.
    - path: "{CLAUDE.md,.claude/**}"
      instructions: |
        Shared, committed working notes. Review for:
        - Constraints stated here must agree with the code. A constraint the code
          no longer honors, or a code change that violates one, is a finding.
        - Nothing machine-specific: no host names, user names, credentials, or
          paths that only resolve on one box.

  auto_review:
    enabled: true
    auto_incremental_review: true
    ignore_title_keywords:
      - "WIP"
      - "DO NOT MERGE"
    # PRs open as drafts so the bot reviews before humans are requested.
    drafts: true
    base_branches:
      - "main"

  tools:
    # No CI here, so there are no checks to wait on. Revisit if that changes.
    github-checks:
      enabled: false
    shellcheck:
      enabled: true
    markdownlint:
      enabled: true

  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
